spring.application.name=flatmate

# Используем локальный файл БД, защищённый от сетевых сбоев
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./flatmatedb;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Настройки генерации таблиц под Postgres-совместимость
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Включаем консоль H2 для просмотра таблиц глазами
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Лимиты для загрузки тяжелых фотографий Base64
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
