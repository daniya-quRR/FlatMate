spring.application.name=flatmate

# База данных: локально H2 в режиме PostgreSQL-совместимости, на хостинге переключится сама
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./flatmatedb;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Настройки генерации таблиц Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Включаем консоль H2, чтобы видеть таблицы глазами в браузере
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Серверный порт (Render сам передает его через переменную PORT при деплое)
server.port=${PORT:8080}

# Ограничения для загрузки тяжелых Base64 фотографий студентов
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
