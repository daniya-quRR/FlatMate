
spring.application.name=flatmate

# База данных: локально H2, на Render PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./flatmatedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Spring Boot определит драйвер по URL базы данных
# Не указываем org.h2.Driver вручную

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Консоль H2 отключена по умолчанию
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Render передает порт через переменную PORT
server.port=${PORT:8080}

# Ограничения загрузки файлов
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
