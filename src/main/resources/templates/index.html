<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FlatMate — Живите вместе</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1A352B; /* Глубокий тёмно-зелёный из анкеты */
            color: #FFFFFF;
            margin: 40px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .main-content {
    max-width: 600px;
    margin-top: 50px;
}
.tagline {
    font-size: 12px;
    color: #B0B5B3;
    font-weight: bold;
}
h1 {
    font-size: 50px;
    margin-bottom: 20px;
}
.description {
    font-size: 16px;
    color: #B0B5B3;
    margin-bottom: 40px;
}

.stat-box {
    display: inline-block;
    margin-right: 30px;
}
.stat-box h2 {
    font-size: 40px;
    margin-bottom: 5px;
}
.stat-box p {
    font-size: 14px;
    color: #B0B5B3;
}

    </style>
</head>
<body>

    <div class="header">
        <div class="logo">FlatMate</div>
    </div>

<div class="main-content">
    <p class="tagline">АЛМАТЫ · ДЛЯ СТУДЕНТОВ</p>
    <h1>Живите вместе —<br>совпадайте по жизни</h1>
    <p class="description">Не объявление в Telegram. Анкета, процент совместимости и чат — чтобы сосед совпал по режиму, чистоте и бюджету.</p>

    <div class="stats-container">
        <div class="stat-box">
            <h2>7</h2>
            <p>привычек в анкете</p>
        </div>
        <div class="stat-box">
            <h2>%</h2>
            <p>прозрачный матч</p>
        </div>
        <div class="stat-box">
            <h2>чат</h2>
            <p>без номера сразу</p>
        </div>
    </div>
</div>


</body>
</html>
