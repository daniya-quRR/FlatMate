<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — FlatMate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #F6F4EB;
            color: #171513;
            padding: 30px 16px;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 28px;
            background: white;
            border-radius: 20px;
        }

        h1 { color: #295241; }

        p { line-height: 1.6; }

        a {
            display: inline-block;
            margin: 12px 8px 0 0;
            padding: 12px 16px;
            background: #295241;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }

.profile-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
}

.profile-actions a {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

.chat-button {
    background: #295241;
    color: white;
}

.back-button {
    background: #e9e7df;
    color: #171513;
}

    </style>
</head>
<body>
<main>
    <h1 th:text="${profileUser.name}">Имя студента</h1>

    <p>
        Возраст:
        <span th:text="${profileUser.age != null ? profileUser.age : 'Не указан'}"></span>
    </p>

    <p>
        Университет:
        <span th:text="${profileUser.university != null and !profileUser.university.isEmpty() ? profileUser.university : 'Не указан'}"></span>
    </p>

    <p>
        Курс:
        <span th:text="${profileUser.course != null ? profileUser.course : 'Не указан'}"></span>
    </p>

    <p>
        О себе:
        <span th:text="${profileUser.about != null and !profileUser.about.isEmpty() ? profileUser.about : 'Описание пока не добавлено'}"></span>
    </p>

    
<div class="profile-actions">
<a th:href="@{/chat/{id}(id=${profileUser.id})}" class="chat-button">
    Перейти в чат
</a>
<a th:href="@{/matches}" class="back-button">Назад к совпадениям</a>
</div>
</main>
</body>
</html>
